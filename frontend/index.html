<html>
<head>
    <title>CORS Demo</title>
</head>
<body>

    <h1>Frontend + Backend CORS Example</h1>

    <button onclick="getData()">Get Data</button>

    <h2 id="result"></h2>

    <script>
        async function getData() {

            try {

                const response = await fetch("http://Backend-LB-935014965.ap-south-1.elb.amazonaws.com/api/message", {
                    method: "GET",
                    credentials: "include"
                });

                const data = await response.json();

                document.getElementById("result").innerText = data.message;

            } catch (error) {

                console.error("Error:", error);

                document.getElementById("result").innerText =
                    "CORS or Backend Error";
            }
        }
    </script>

</body>
</html>
